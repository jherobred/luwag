<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Luwag Storage</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="See what is using this PC and send chosen files to the Recycle Bin.">
<link rel="stylesheet" href="app.css">
<svg class="sprite" aria-hidden="true">
  <symbol id="i-brand" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2"/><path d="M12 4.5v2.2M12 17.3V19.5M4.5 12h2.2M17.3 12H19.5"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4.5h6V7"/></symbol>
  <symbol id="i-cache" viewBox="0 0 24 24"><path d="M4 8h16M4 12h16M4 16h16"/><path d="M7 8V6.5A2.5 2.5 0 0 1 9.5 4h5A2.5 2.5 0 0 1 17 6.5V8"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="M9 7.5L4.5 12 9 16.5M15 7.5L19.5 12 15 16.5"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3.5h7l5 5V20a1.5 1.5 0 0 1-1.5 1.5h-10.5A1.5 1.5 0 0 1 5.5 20V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M14 3.5V9h5.5"/></symbol>
  <symbol id="i-twins" viewBox="0 0 24 24"><rect x="3.5" y="6" width="10" height="13" rx="2"/><path d="M10.5 3.5h7.5a2.5 2.5 0 0 1 2.5 2.5v10"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7.5 11.5L12 16l4.5-4.5"/><path d="M5 20h14"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6z"/></symbol>
  <symbol id="i-prefs" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="i-max" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
  <symbol id="i-unmax" viewBox="0 0 24 24"><rect x="5.5" y="8.5" width="10" height="10" rx="1.5"/><path d="M8.5 5.5h8.5a1.5 1.5 0 0 1 1.5 1.5v8.5"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M14.5 4.5v15"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2"/><path d="M15.5 8.5V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6.5a2 2 0 0 0 2 2h1.5"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8.5 8.5M18 14v3.5a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 4 17.5v-9A2.5 2.5 0 0 1 6.5 6H10"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5V9H15"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
</svg>

<div class="caption">
  <button type="button" id="w-min" aria-label="Minimize"><svg class="i" aria-hidden="true"><use href="#i-min"/></svg></button>
  <button type="button" id="w-max" aria-label="Maximize"><svg class="i" aria-hidden="true"><use href="#i-max"/></svg></button>
  <button type="button" id="w-close" class="x" aria-label="Close"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button>
</div>
<div class="grips" id="grips" aria-hidden="true">
  <div data-edge="left"></div>
  <div data-edge="right"></div>
  <div data-edge="top"></div>
  <div data-edge="bottom"></div>
  <div data-edge="topleft"></div>
  <div data-edge="topright"></div>
  <div data-edge="bottomleft"></div>
  <div data-edge="bottomright"></div>
</div>

<div class="app" id="app">
  <aside class="side" id="side">
    <div class="side-top">
      <span class="brand pywebview-drag-region"><img class="model brand-mark" src="models/logo.png" alt=""><span>Luwag <em>Storage</em></span></span>
      <button type="button" class="icon" id="toggle-side" aria-label="Collapse the sidebar"><svg class="i" aria-hidden="true"><use href="#i-left"/></svg></button>
    </div>
    <nav class="nav" id="nav" aria-label="Views">
      <button type="button" data-view="overview"><img class="model" src="models/disk.png" alt=""><span>Overview</span></button>
      <button type="button" data-view="junk"><img class="model" src="models/bin.png" alt=""><span>Junk</span><em></em></button>
      <button type="button" data-view="caches"><img class="model" src="models/cache.png" alt=""><span>Caches</span><em></em></button>
      <button type="button" data-view="dev"><img class="model" src="models/code.png" alt=""><span>Dev leftovers</span><em></em></button>
      <button type="button" data-view="large"><img class="model" src="models/page.png" alt=""><span>Large files</span><em></em></button>
      <button type="button" data-view="duplicates"><img class="model" src="models/twins.png" alt=""><span>Duplicates</span><em></em></button>
      <button type="button" data-view="downloads"><img class="model" src="models/parcel.png" alt=""><span>Old downloads</span><em></em></button>
      <button type="button" data-view="recycle"><img class="model" src="models/bin.png" alt=""><span>Recycle Bin</span><em></em></button>
      <button type="button" data-view="protected"><img class="model" src="models/shield.png" alt=""><span>Protected</span></button>
    </nav>
    <span class="grow"></span>
    <button type="button" class="side-foot" id="open-settings"><svg class="i" aria-hidden="true"><use href="#i-prefs"/></svg><span>Settings</span></button>
  </aside>

  <main class="main">
    <div class="dragstrip pywebview-drag-region" aria-hidden="true"></div>
    <header class="bar">
      <div class="title pywebview-drag-region">
        <h1 id="title">Overview</h1>
        <p id="sub" class="meta"></p>
      </div>
      <label class="search"><span>Search</span><input id="query" type="search" placeholder="Names and folders" spellcheck="false" autocomplete="off"></label>
    </header>
    <div class="tools" id="tools">
      <div class="chips" id="risks">
        <button type="button" data-risk="all" class="on">All</button>
        <button type="button" data-risk="low">Safe</button>
        <button type="button" data-risk="review">Review</button>
      </div>
      <span class="grow"></span>
      <button type="button" class="pill" id="scan-disk">Scan folders</button>
      <button type="button" class="pill primary" id="scan">Scan this PC</button>
      <button type="button" class="pill" id="stop" hidden>Stop</button>
      <select id="sort" aria-label="Sort">
        <option value="size">Biggest first</option>
        <option value="name">Name</option>
        <option value="old">Oldest first</option>
        <option value="new">Newest first</option>
      </select>
    </div>
    <div class="status" id="status" hidden>
      <div class="meter busy" id="status-meter"><span></span></div>
      <p id="status-text"></p>
    </div>
    <div class="scroll" id="scroll">
      <div id="body"></div>
    </div>
    <div class="selbar" id="selbar" hidden>
      <strong id="sel-count"></strong>
      <button type="button" id="sel-recycle" class="bad">Recycle</button>
      <button type="button" id="sel-reveal">Show in Explorer</button>
      <button type="button" id="sel-copy">Copy paths</button>
      <button type="button" id="sel-protect">Protect</button>
      <span class="grow"></span>
      <button type="button" id="sel-all">Select visible</button>
      <button type="button" id="sel-none" class="icon" aria-label="Clear selection"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
  </main>

  <aside class="peek" id="peek">
    <div class="peek-top">
      <button type="button" class="icon" id="toggle-peek" aria-label="Collapse the preview"><svg class="i" aria-hidden="true"><use href="#i-right"/></svg></button>
      <span class="peek-label pywebview-drag-region" id="peek-label">Details</span>
    </div>
    <div class="peek-body" id="peek-body"></div>
    <div class="peek-rail" id="peek-rail"></div>
  </aside>
</div>

<nav class="phone-nav" id="phone-nav" aria-label="Phone views">
  <button type="button" data-view="overview"><img class="model" src="models/disk.png" alt="" width="28" height="28"><span>Overview</span></button>
  <button type="button" data-view="junk"><img class="model" src="models/bin.png" alt="" width="28" height="28"><span>Junk</span></button>
  <button type="button" data-view="caches"><img class="model" src="models/cache.png" alt="" width="28" height="28"><span>Caches</span></button>
  <button type="button" data-view="dev"><img class="model" src="models/code.png" alt="" width="28" height="28"><span>Dev</span></button>
  <button type="button" id="phone-more-open"><img class="model" src="models/folder.png" alt="" width="28" height="28"><span>More</span></button>
</nav>

<div class="menu" id="menu" hidden role="menu"></div>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
<dialog class="prefs" id="prefs" aria-labelledby="prefs-title">
  <header class="prefs-head">
    <h2 id="prefs-title">Settings</h2>
    <button type="button" class="icon" id="prefs-close" aria-label="Close settings"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button>
  </header>
  <div class="prefs-body" id="prefs-body"></div>
</dialog>
<dialog class="sheet" id="phone-more" aria-labelledby="phone-more-title">
  <form method="dialog" class="sheet-pad">
    <h2 id="phone-more-title">More</h2>
    <div class="phone-more-list" id="phone-more-list">
      <button type="button" data-view="large"><img class="model" src="models/page.png" alt=""><span>Large files</span></button>
      <button type="button" data-view="duplicates"><img class="model" src="models/twins.png" alt=""><span>Duplicates</span></button>
      <button type="button" data-view="downloads"><img class="model" src="models/parcel.png" alt=""><span>Old downloads</span></button>
      <button type="button" data-view="recycle"><img class="model" src="models/bin.png" alt=""><span>Recycle Bin</span></button>
      <button type="button" data-view="protected"><img class="model" src="models/shield.png" alt=""><span>Protected</span></button>
      <button type="button" id="phone-details"><img class="model" src="models/photo.png" alt=""><span>Details</span></button>
      <button type="button" id="phone-settings"><img class="model" src="models/logo.png" alt=""><span>Settings</span></button>
    </div>
    <div class="btns"><button type="submit" class="pill">Close</button></div>
  </form>
</dialog>
<dialog class="hello" id="hello" aria-labelledby="hello-title">
  <form method="dialog">
    <img class="model peek-model" id="hello-model" src="models/logo.png" alt="" width="112" height="112">
    <p class="note" id="hello-step">1 of 3</p>
    <h2 id="hello-title">See this PC</h2>
    <p id="hello-text"></p>
    <label class="hello-motion" id="hello-motion-row"><input type="checkbox" id="hello-motion" checked> Let the models move</label>
    <div class="btns">
      <button type="button" class="pill" id="hello-back">Back</button>
      <button type="button" class="pill primary" id="hello-next">Next</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" hidden role="status"><span id="toast-text"></span><button type="button" id="toast-act" hidden>Scan again</button></div>
<div id="live" class="sr" aria-live="polite"></div>
<script src="app.js?v=8"></script>
